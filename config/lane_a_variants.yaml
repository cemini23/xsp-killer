# still runs via lane_a_rules.yaml + systemd.
# Scoreboard: briefs/xsp-lane-a-variants-scoreboard.json
#
# Capacity (8GB VPS): ~6 active after 2026-07-16 UW BT prune (dip-swing grid off).
# Soak focus: 28 DTE ATM trio (atm / easy_tp / yellow_mid_bounce). LIVE untouched.

