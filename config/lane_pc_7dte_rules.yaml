# Isolated paper sleeve — 7 DTE Mon/Tue only (Friday flatten needs hold time).
# Log-only. Never places multi-leg. Does not share Lane A or 14 DTE PC state.
lane: PC7
instrument: XSP
option_type: put
structure: put_credit
live_untouched: true

entry:
  window_start_et: "15:45"
  window_end_et: "16:00"
  dte_target: 7
  width_strikes: 1
  weekdays: [0, 1]
  require_above_ma20: true
  ma_period: 20
  skip_fomc: true
  require_window: true

exit:
  velocity_pct: 0.76
  max_hold_sessions: 5
  friday_flatten_enabled: true
  friday_flatten_et: "15:45"

paper_entry:
  enabled: true
  quantity: 1
  max_open_positions: 1

logging:
  logic_version: xsp_lane_pc_7dte_v1
  log_path: logs/lane_pc_7dte_paper.jsonl
  state_path: briefs/lane-pc-7dte-state.json
  scoreboard_path: briefs/lane-pc-7dte-scoreboard.json
